# Gradle version catalog — single source of truth for plugin + dependency versions.
# Referenced from build.gradle.kts via `libs.xxx.yyy` (kebab-case → camelCase).
#
# v9: introduced from previously inline-versioned app/build.gradle.kts. Update
# versions here and Android Studio will offer to bump them across every module.

[versions]
# Build tooling
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
ktlint-gradle = "14.2.0"
paparazzi = "2.0.0-alpha05.1"

# AndroidX core
activity-compose = "1.13.0"
appcompat = "1.8.0"
core-ktx = "1.19.1"
core-splashscreen = "1.2.0"
lifecycle = "2.11.0"

# Compose
compose-bom = "2026.09.00"
navigation-compose = "2.10.2"

# DI
hilt = "2.60.1"
hilt-androidx = "1.4.0"

# Data
datastore = "1.2.1"
room = "2.8.5"
serialization = "1.11.0"
coroutines = "1.11.0"

# Security
biometric = "1.1.0"
security-crypto = "1.1.0"

# Google services
play-services-auth = "22.0.0"

# Widgets / work / media / icons
# v9: glance + material 2 removed from dependencies (see app/build.gradle.kts).
# Versions kept here for quick re-add if/when we ship a Glance widget or hit a
# Material Components runtime requirement.
glance = "1.1.1"
work = "2.12.0"
material = "1.14.0"
accompanist-permissions = "0.37.3"
coil = "2.7.0"
profileinstaller = "1.4.1"
# v10: Baseline Profile generation + startup Macrobenchmark (:baselineprofile module).
benchmark = "1.5.0"
uiautomator = "2.4.0"
sentry = "8.61.1"

# Logging
timber = "5.0.1"

# Testing
junit = "4.13.2"
mockk = "1.14.11"
ext-junit = "1.3.0"
espresso = "3.7.0"
robolectric = "4.17"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
mockwebserver = "5.5.0"

[libraries]
# Compose BOM + members (versions pulled from the BOM)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Activity + lifecycle
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-androidx" }

# AndroidX foundation
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-androidx" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt-androidx" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Security
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# Google sign-in (for Drive backup)
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "play-services-auth" }

# Widgets + WorkManager
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Material 2 (theme XML only — Compose uses Material 3)
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Permissions
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist-permissions" }

# Image loading
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Installs the app's Baseline Profile (generated by :baselineprofile, committed
# under app/src/main/generated/baselineProfiles/) on devices without Play.
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# v9.3: only ever initialized if SENTRY_DSN is set at build time (see
# AILauncherApp.initSentry) — fully inert, sends nothing, absent that.
# v10: sentry-android-core, not the `sentry-android` umbrella — the umbrella also
# pulls sentry-android-ndk, which shipped ~2 MB of native .so files across four
# ABIs for a reporter that's off by default. Core still catches JVM crashes;
# only native (C/C++) crash capture is lost, and this app has no native code.
sentry-android-core = { group = "io.sentry", name = "sentry-android-core", version.ref = "sentry" }

# Logging
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "ext-junit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
# v10: HiltTestApplication + @HiltAndroidTest for the instrumented LauncherFlowTest.
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }

[bundles]
# v9.3: the 7 Compose libraries almost always get added together to a module;
# `implementation(libs.bundles.compose)` replaces that whole block in one line.
# Not retrofitted onto app/build.gradle.kts's existing individual lines (each
# carries its own debugImplementation/testImplementation split that a bundle
# can't express) — this is for the *next* module that needs Compose.
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-material3",
    "compose-material-icons-extended",
    "compose-animation",
    "compose-foundation",
    "compose-ui-tooling-preview",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
