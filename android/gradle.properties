org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# v9.3: caches the task graph itself (not just task outputs like the build cache
# already configured in CI via gradle/actions/setup-gradle) — skips the whole
# configuration phase on a cache hit. If a future plugin bump turns out to be
# config-cache-incompatible, Gradle reports it clearly at build time; the fix is
# either a plugin update or dropping this line, not a silent breakage.
org.gradle.configuration-cache=true
# R8 in full mode is stricter about keep rules than the default mode — see the
# comment on proguard-rules.pro if a future release build starts stripping
# something the default mode tolerated.
android.enableR8.fullMode=true
