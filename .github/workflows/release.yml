# v9.3: release-on-tag workflow. Push a tag matching v*.*.* (e.g. v9.3.0) and
# this builds the signed release APK and attaches it to a new draft GitHub
# Release as NoveLauncher-X.Y.Z-release.apk.
#
# v10: APK only. Releases up to 10.0.0 also carried the .aab, which nobody can
# install from GitHub (it's an upload format for Google Play), and whose v1
# signature files are named after the key alias. Every store this app is on
# takes the APK. If a store ever needs the AAB, build it locally with
# `./gradlew bundleRelease` and the RELEASE_* env vars — don't publish it here.
#
# Signing follows the exact same opt-in pattern as android.yml's release build:
# absent the RELEASE_KEYSTORE_BASE64 (+ password/alias) secrets, the outputs
# are unsigned — same as a local `assembleRelease` with no env vars set. This
# workflow does not change that contract; it only automates what was previously
# a manual "build locally, sign locally, upload to GitHub by hand" step.
#
# Tagging is manual (`git tag vX.Y.Z && git push origin vX.Y.Z`) — nothing here
# creates a tag automatically, so a release only happens when someone chooses to.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build + publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # needed to create the GitHub Release
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Assemble release APK (R8)
        run: ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Report APK size
        run: |
          {
            echo "### Release APK size"
            for f in app/build/outputs/apk/release/*.apk; do
              [ -f "$f" ] && echo "- \`$(basename "$f")\`: $(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # An unsigned APK is named app-release-unsigned.apk and Android refuses to
      # install it at all. Attaching one to a public release is worse than
      # attaching nothing: it sits next to the real download looking like a
      # choice. So when signing isn't configured, fail loudly instead — the
      # release notes still get created below, just without binaries.
      - name: Fail if release would be unsigned
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "::error::RELEASE_KEYSTORE_BASE64 (and the password/alias secrets) are not set, so this build is UNSIGNED and cannot be installed on any device. Add the signing secrets to this repository, then re-run. See the 'Release signing' section in CLAUDE.md."
          exit 1

      # Same file name as every earlier release, so links and store kits can
      # rely on it: NoveLauncher-<version>-release.apk.
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/NoveLauncher-${GITHUB_REF_NAME#v}-release.apk"

      - name: Checksum
        run: |
          cd app/build/outputs/apk/release
          for f in NoveLauncher-*-release.apk; do sha256sum "$f" > "$f.sha256"; done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/apk/release/NoveLauncher-*-release.apk
            android/app/build/outputs/apk/release/NoveLauncher-*-release.apk.sha256
          generate_release_notes: true
          draft: true  # review before publishing — never auto-publish to users
