# GitHub Actions CI for NoveLauncher.
#
# Runs on every push to main + every pull request targeting main, as three
# independent jobs that run in parallel (not chained with `needs:` — none of
# them depends on another's output):
#   1. build — assembleDebug + assembleRelease (R8), lint, ktlint, APK size.
#   2. test — unit tests + Jacoco coverage.
#   3. instrumented-tests — advisory only (continue-on-error), runs the single
#      androidTest smoke test on an emulator. Kept separate from `build`/`test`
#      because emulator boot is the slowest and flakiest part of the pipeline;
#      isolating it means a flaky boot never blocks the fast, reliable jobs.
#
# v9.3: split from one sequential job into these three — the previous version
# ran everything (build, lint, ktlint, tests, coverage) in a single job, so a
# slow step delayed feedback on everything after it. Splitting `build` and
# `test` apart doesn't change total runner-minutes much (each pays its own
# checkout/JDK/Gradle-setup cost) but roughly halves wall-clock time to green
# since they now run concurrently.
#
# Notes:
#   * Release signing is opt-in via repo secrets (RELEASE_KEYSTORE_BASE64,
#     RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). Until
#     those are added, the release build is unsigned — same as before — because
#     android/app/build.gradle.kts only wires up signingConfigs["release"] when a
#     real keystore file is present. No keystore is generated or stored by this repo.
#   * Self-hosted runners are not necessary for this project; ubuntu-latest
#     provides Android SDK 35 out of the box, and (per reactivecircus/android-
#     emulator-runner's docs) GitHub-hosted Linux runners support the KVM
#     acceleration the emulator job needs.

name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allow running manually from the Actions tab

# Cancel earlier runs for the same branch when a newer push arrives — avoids
# the queue bloat from rapid-fire commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `secrets` isn't a valid context inside step-level `if:` conditions (GitHub
    # rejects the workflow at parse time with "Unrecognized named-value: secrets").
    # Route it through `env` instead, which `if:` can read.
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    # v9.1: the Gradle project moved into android/ (repo root now holds only
    # android/ + assets/). `run:` steps execute here; upload-artifact `path:`
    # values are NOT affected by working-directory, so those still need an
    # explicit android/ prefix below.
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Speeds up subsequent runs from ~6 min to ~90 s. Gradle's own caching is
      # picky about restore keys, so we lean on the official setup-gradle action.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true  # lint findings shouldn't fail CI yet

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace
        continue-on-error: true  # codebase predates ktlint; advisory only, same policy as lint

      # Only runs (and only produces a file) when RELEASE_KEYSTORE_BASE64 is set
      # in repo secrets. Absent that secret, this step is skipped and the release
      # build below stays unsigned, exactly like before.
      - name: Decode release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      # Runs R8/resource-shrinking on the release build so keep-rule problems
      # (e.g. kotlinx.serialization models stripped by the optimizer) surface in
      # CI instead of as a release-only crash. Signed only when the keystore
      # secrets above are present — see app/build.gradle.kts signingConfigs.
      - name: Assemble release (R8)
        run: ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # v9.3: cheap size-regression visibility — no history/diffing (that needs
      # somewhere to persist prior runs' numbers, which is a bigger addition),
      # just today's number in the run summary so a surprise jump is visible
      # without downloading the artifact.
      - name: Report APK size
        if: always()
        run: |
          {
            echo "### APK size"
            for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -f "$apk" ] && echo "- \`$(basename "$apk")\`: $(du -h "$apk" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: novelauncher-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      # Only produces a file when the release build was actually signed
      # (RELEASE_KEYSTORE_BASE64 set) — otherwise there's nothing installable
      # to upload here, so a missing file is expected, not an error.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_SIGNING == 'true'
        with:
          name: novelauncher-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload ktlint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ktlint-report
          path: android/app/build/reports/ktlint/
          retention-days: 14
          if-no-files-found: ignore

  test:
    name: Unit tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Coverage report
        run: ./gradlew jacocoTestReport --stacktrace

      # Paparazzi screenshot tests (see HomeAppItemSnapshotTest) — compares
      # against the goldens committed under app/src/test/snapshots/. A real
      # visual change needs `./gradlew recordPaparazziDebug` run locally and
      # the updated PNGs committed alongside the code change.
      - name: Screenshot tests (Paparazzi)
        run: ./gradlew verifyPaparazziDebug --stacktrace

      - name: Upload Paparazzi report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paparazzi-report
          path: android/app/build/reports/paparazzi/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: android/app/build/reports/jacoco/jacocoTestReport/
          retention-days: 14
          if-no-files-found: ignore

  instrumented-tests:
    name: Instrumented tests (emulator, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # v9.3: first-ever androidTest job — no history of how reliable emulator
    # boot is on this project's CI yet. continue-on-error so a flaky/slow boot
    # never blocks a PR; promote this to blocking once it's proven stable.
    continue-on-error: true
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: android
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-report
          path: android/app/build/reports/androidTests/connected/
          retention-days: 14
          if-no-files-found: ignore
