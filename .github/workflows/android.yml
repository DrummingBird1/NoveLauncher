# GitHub Actions CI for NoveLauncher.
#
# Runs on every push to main + every pull request targeting main:
#   1. Sets up JDK 17 (matches build.gradle.kts compileOptions).
#   2. Restores the gradle wrapper jar (gitignored locally — checked in here for CI).
#   3. Caches ~/.gradle/caches and ~/.gradle/wrapper for fast incremental runs.
#   4. Builds debug APK + release APK (R8 / shrinkResources path).
#   5. Runs Android Lint and unit tests.
#   6. Uploads the debug APK and lint report as build artefacts.
#
# Notes:
#   * Release signing is opt-in via repo secrets (RELEASE_KEYSTORE_BASE64,
#     RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). Until
#     those are added, the release build is unsigned — same as before — because
#     app/build.gradle.kts only wires up signingConfigs["release"] when a real
#     keystore file is present. No keystore is generated or stored by this repo.
#   * Self-hosted runners are not necessary for this project; ubuntu-latest
#     provides Android SDK 35 out of the box.

name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allow running manually from the Actions tab

# Cancel earlier runs for the same branch when a newer push arrives — avoids
# the queue bloat from rapid-fire commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `secrets` isn't a valid context inside step-level `if:` conditions (GitHub
    # rejects the workflow at parse time with "Unrecognized named-value: secrets").
    # Route it through `env` instead, which `if:` can read.
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Speeds up subsequent runs from ~6 min to ~90 s. Gradle's own caching is
      # picky about restore keys, so we lean on the official setup-gradle action.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true  # lint findings shouldn't fail CI yet

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace
        continue-on-error: true  # codebase predates ktlint; advisory only, same policy as lint

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Coverage report
        run: ./gradlew jacocoTestReport --stacktrace

      # Only runs (and only produces a file) when RELEASE_KEYSTORE_BASE64 is set
      # in repo secrets. Absent that secret, this step is skipped and the release
      # build below stays unsigned, exactly like before.
      - name: Decode release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      # Runs R8/resource-shrinking on the release build so keep-rule problems
      # (e.g. kotlinx.serialization models stripped by the optimizer) surface in
      # CI instead of as a release-only crash. Signed only when the keystore
      # secrets above are present — see app/build.gradle.kts signingConfigs.
      - name: Assemble release (R8)
        run: ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: novelauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      # Only produces a file when the release build was actually signed
      # (RELEASE_KEYSTORE_BASE64 set) — otherwise there's nothing installable
      # to upload here, so a missing file is expected, not an error.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_SIGNING == 'true'
        with:
          name: novelauncher-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload ktlint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ktlint-report
          path: app/build/reports/ktlint/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          retention-days: 14
          if-no-files-found: ignore
